spring.application.name=semana1

#Configuracion de base de datos Oracle
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/free
spring.datasource.username=fs3
spring.datasource.password=fs3
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


#Configuracion de JPA
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
srping.jpa.hibernate.dll-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
srping.jpa.properties.hibernate.dialect=org.hibernate.dialect.OraclecDialect
